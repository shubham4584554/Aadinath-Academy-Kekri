:root{

.school-box .eyebrow,.side-label{font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:#8495b4;font-weight:800}
.school-box b{display:block;color:#fff;font-size:12px;margin-top:4px}.school-box span{font-size:9px;color:#95a4c2}
.nav-label{font-size:8px;letter-spacing:.14em;color:#7184a5;font-weight:800;text-transform:uppercase;margin:15px 6px 6px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;color:#b9c5da;padding:9px 10px;margin:2px 0;border:0;background:transparent;border-radius:11px;text-align:left;font-size:11px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}.nav-item.active{background:linear-gradient(90deg,rgba(65,103,255,.31),rgba(123,81,255,.18));box-shadow:inset 3px 0 0 #8492ff,0 8px 22px rgba(33,48,95,.16);color:#fff}.nav-item .ico{width:22px;text-align:center;font-size:12px}
.main{margin-left:280px;width:calc(100% - 280px);min-width:0}

.content{padding:25px;max-width:1900px;margin:auto}
.hero-row{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:18px}.title h1{font-size:30px;letter-spacing:-.045em;margin:0}.title p{font-size:11px;color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 13px;font-size:10px;font-weight:800}.primary{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));box-shadow:0 10px 20px rgba(65,103,255,.16)}.soft{color:#3d56c8;background:#eef2ff}.white{color:#46536a;background:#fff;border:1px solid var(--line)}.danger{color:#bd3e48;background:#fff0f2}
.card{background:#fff;border:1px solid rgba(226,231,239,.95);border-radius:18px;box-shadow:var(--shadow)}.panel{padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panel-head h3{font-size:13px;margin:0;letter-spacing:-.01em}.muted{font-size:10px;color:#8591a7}
.grid{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900;white-space:nowrap}.good{background:#e9f9f2;color:#147b59}.warn{background:#fff5df;color:#a26d04}.bad{background:#ffecef;color:#bd3f4a}.blue{background:#ebefff;color:#3f56cb}
.kpis{display:grid;grid-template-columns:1.1fr .95fr .95fr;gap:13px}.small-stat{padding:15px}.small-stat b{font-size:22px}.small-stat p{font-size:9px;color:var(--muted);margin-top:4px}

.section{display:flex;justify-content:space-between;align-items:center;margin:19px 0 9px}.section b{font-size:12px}.section span{font-size:9px;color:#8b96a8}
.list{display:flex;flex-direction:column}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0f2f6}.row:last-child{border-bottom:0}.row-main{display:flex;align-items:center;gap:9px;min-width:0}.mini{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#eef2ff,#f7f3ff);display:grid;place-items:center;font-size:10px;font-weight:800;color:#4b60cf}.row b{font-size:10px}.row small{font-size:8px;color:var(--muted);display:block;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;font-size:10px;outline:0}.toolbar .grow{flex:1;min-width:160px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:10px}.table th{text-align:left;color:#7f8ba0;text-transform:uppercase;letter-spacing:.06em;font-size:8px;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:10px 9px;border-bottom:1px solid #f0f2f6;white-space:nowrap}.table tr:hover td{background:#fafbff}
.module-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.module{padding:14px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#fbfcff);position:relative;cursor:pointer;transition:.16s}.module:hover{transform:translateY(-2px);box-shadow:0 13px 28px rgba(20,31,61,.09);border-color:#dbe2f5}.module .micon{width:37px;height:37px;border-radius:11px;background:#eef2ff;color:#4167ff;display:grid;place-items:center;margin-bottom:9px}.module b{display:block;font-size:10px}.module span{display:block;font-size:8px;color:var(--muted);margin-top:4px;line-height:1.35}.module:after{content:"›";position:absolute;right:12px;top:10px;color:#b4bdcd;font-size:17px}
.tabs{display:flex;gap:5px;padding:4px;background:#f5f6fa;border-radius:11px;width:max-content;max-width:100%;overflow:auto}.tabs button{border:0;background:transparent;padding:7px 10px;border-radius:8px;font-size:9px;color:#7c8799;white-space:nowrap}.tabs button.active{background:#fff;color:#3d50bd;box-shadow:0 4px 10px rgba(20,31,61,.05);font-weight:800}

@media(max-width:1320px){.module-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.kpis{grid-template-columns:1fr 1fr}.sidebar{width:250px}.main{margin-left:250px;width:calc(100% - 250px)}}
@media(max-width:980px){.g4,.g3,.g2{grid-template-columns:1fr 1fr}.module-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-layout{grid-template-columns:1fr}.search{width:38vw}}
@media(max-width:700px){.sidebar{display:none}.main{margin-left:0;width:100%}.topbar{padding:0 12px}.search{width:55vw}.top-actions .pill,.top-actions .select{display:none}.content{padding:15px}.g4,.g3,.g2,.kpis{grid-template-columns:1fr}.module-cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.hero-row{flex-direction:column;align-items:flex-start}}
</style>

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function initials(s){return String(s).split(" ").map(x=>x[0]).slice(0,2).join("").toUpperCase();}
function byId(id){return MODULES.find(x=>x[0]===id);}
function notify(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2200);}
function save(){localStorage.setItem("academy_school_demo_state",JSON.stringify(state));}
function load(){try{const s=JSON.parse(localStorage.getItem("academy_school_demo_state"));if(s)Object.assign(state,s)}catch(e){}}
function badge(status){
 const x=(status||"").toLowerCase();
 const c=x.includes("paid")||x.includes("active")||x.includes("approved")||x.includes("returned")||x.includes("completed")||x.includes("open")||x.includes("available")?"good":x.includes("pending")||x.includes("partial")||x.includes("review")||x.includes("leave")||x.includes("low")?"warn":x.includes("absent")||x.includes("overdue")||x.includes("reject")||x.includes("follow")||x.includes("incomplete")?"bad":"blue";
 return `<span class="badge ${c}">${esc(status)}</span>`;
}
function stat(label,num,delta,ico){return `<div class="card stat"><div class="label">${label}</div><div class="num">${num}</div><div class="delta">${delta}</div><div class="ico">${ico}</div></div>`}
function btn(text,action,cls="white",payload=""){return `<button class="btn ${cls}" data-action="${action}" ${payload?`data-payload="${esc(payload)}"`:""}>${text}</button>`}

function buildSidebar(){
 const groups={};
 MODULES.forEach(m=>(groups[m[4]]??=[]).push(m));
 const logo = LOGO ? `<img src="${LOGO}" alt="School logo">` : `<div class="logo-fallback">AA</div>`;
 let h=`<div class="brand"><div class="logo">${logo}</div><div><b>${esc(SCHOOL.name)}</b><small>School Management Software</small></div></div>
 <div class="school-box"><div class="eyebrow">Institution</div><b>${esc(SCHOOL.name)}</b><span>${esc(SCHOOL.location)} • ${SCHOOL.academicYear}</span></div>`;
 Object.entries(groups).forEach(([g,items])=>{
  h+=`<div class="nav-label">${g}</div>`;
  items.forEach(m=>h+=`<button class="nav-item ${m[0]===state.screen?'active':''}" data-action="navigate" data-payload="${m[0]}"><span class="ico">${m[1]}</span><span>${m[2]}</span></button>`);
 });

function render(){
 buildSidebar();
 document.getElementById("content").innerHTML = state.screen==="dashboard"?dashboard():genericModule(state.screen);
 document.getElementById("search").value=state.search||"";
}
function openScreen(id){state.screen=id;state.tab="";save();render();window.scrollTo({top:0,behavior:"smooth"});}
function addActivity(text,sub){state.activity.unshift({time:"now",text,sub});state.activity=state.activity.slice(0,6);save();}

function openModal(title,body,foot=true){
 document.getElementById("modal").innerHTML=`<div class="modal-head"><div><b>${title}</b><small>Interactive mock-data workflow • No real data affected</small></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${btn("Cancel","close-modal","white")} ${btn("Save & Continue","modal-save","primary")}</div>`:""}`;
 document.getElementById("overlay").style.display="flex";
}
function closeModal(){document.getElementById("overlay").style.display="none";}
function genericForm(title,entity){

 if(a==="filter"){notify("Filters applied to the demo table");return;}

 if(a==="check-conflicts"){openModal("Timetable Conflict Check",`<div class="notice">No blocking conflicts found for ${esc(state.campus)}.</div><div style="margin-top:12px">${badge("42 classes checked")} ${badge("61 rooms checked")} ${badge("185 teachers checked")}</div>`);return;}

 if(a==="route-stops"){openModal("Route Stops",`<div class="list">${["City Circle","Market Road","ETC Gate","School Main Gate"].map((x,i)=>`<div class="row"><span>${i+1}. ${x}</span><span class="muted">ETA ${["08:18","08:22","08:26","08:31"][i]}</span></div>`).join("")}</div>`);return;}
 if(a==="contact-driver"){notify("Driver contact card opened");return;}
 if(["issue-book","return-book"].includes(a)){openModal(a==="issue-book"?"Issue Book":"Return Book",`<div class="form-grid"><div class="field"><label>Book</label><select><option>The Enchanted Forest</option><option>Science Today</option><option>World Atlas</option></select></div><div class="field"><label>Student</label><select><option>Aarav Sharma</option><option>Priya Verma</option></select></div></div>`);return;}
 if(a==="inventory-action"){notify("Inventory workflow opened for "+p);return;}
 if(a==="schedule-report"||a==="generate-preview"){openModal("Report Workflow",`<div class="notice">Your ${a==="schedule-report"?"scheduled report":"preview"} has been created in demo mode.</div>`);return;}
 if(a==="open-report"){openModal(p,`<div class="card panel"><div class="panel-head"><h3>${esc(p)}</h3>${badge("Live Mock Data")}</div><div class="chart">${[48,64,59,76,84,91].map(h=>`<div class="bar" style="height:${h}%"></div>`).join("")}<div class="chart-labels"><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span></div></div><div style="margin-top:10px">${btn("Apply Filters","filter","soft")} ${btn("Export Report","export","primary")}</div></div>`);return;}
 if(a==="configure-role"||a==="manage-campus"||a==="configure-setting"||a==="configure-role"){genericForm("Configure "+p,"Settings");return;}

document.getElementById("search").addEventListener("input",e=>{state.search=e.target.value;save();});
document.getElementById("search").addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const q=state.search.toLowerCase().trim();
 if(!q)return;
 const hit=MODULES.find(m=>m[2].toLowerCase().includes(q)||m[3].toLowerCase().includes(q));
 if(hit){openScreen(hit[0]);notify("Opened "+hit[2]);}else{
  const stu=DATA.students.find(s=>s.name.toLowerCase().includes(q));
  if(stu){openModal("Student Search Result",`<div class="card panel"><div class="row-main"><div class="mini">${initials(stu.name)}</div><div><b>${stu.name}</b><small>${stu.class} • ${stu.id} • Attendance ${stu.attendance}% • Fee ₹${stu.fee.toLocaleString()}</small></div></div></div>`)}
  else notify("No matching demo record");
 }
});
